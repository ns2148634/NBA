name: B - Daily Injury & Prediction

# 排程 B：抓取官網傷病報告，產出「當日」與「下一賽事日」預測。
# 時段以「台北開賽時間」回推（cron 一律 UTC，台北 = UTC+8）：
#   UTC 13/15   → 台北 21:00 / 23:00，服務「台北隔日 02:00–05:00」開打的週末場次；
#   UTC 17/19/21→ 台北 01:00 / 03:00 / 05:00，服務「台北當日 06:00–11:00」開打的場次
#                 （延遲 1–3 小時仍來得及在開打前落地）；
#   UTC 22:30   → 台北隔日 06:30，開打前最後一趟（備援）＋賽果回填。
# GitHub 的 schedule 常延遲 1–10 小時，甚至整個時段被跳過；多時段 + 每一趟都先產生
#   「下一賽事日」預測（data/next_predictions.json，會顯示在靜態頁），
#   可大幅降低「預測在開賽後才產生／看不到」的機率。
# 若當天已有賽前預測，賽後那趟不會用它覆蓋（main._should_keep_pre_game）。
# 產出：data/daily_predictions.json、data/next_predictions.json、
#   data/history_log.csv（必要時一併刷新 team_ratings.json）
on:
  schedule:
    - cron: "0 13,15 * * *"
    - cron: "0 17,19,21 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "比賽日期（美東時間 YYYY-MM-DD，留空代表今天）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: nba-data-write
  cancel-in-progress: false

jobs:
  daily-prediction:
    name: Generate daily predictions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # nbainjuries 透過 tabula-py 解析官網 PDF，需要 JRE/JDK。
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Verify Java
        run: java -version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 每一趟都先產生「下一個美東賽事日」的預測，寫進 data/next_predictions.json：
      # 靜態頁會多一個「下一賽事日預測」區塊，即使隔天排程延遲到開打後才跑，
      # 你也能在前一晚就查到預測。失敗不影響 commit（continue-on-error），
      # 最後寫進 daily_predictions.json 的仍是「今天」的賽程，首頁不會被隔日賽程蓋掉。
      - name: Generate next-day predictions
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          TZ: "Asia/Taipei"
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ -n "${INPUT_DATE}" ]; then
            EXTRA_ARGS+=(--date "${INPUT_DATE}")
          fi
          python -m src.main --mode predict --next-day "${EXTRA_ARGS[@]}"

      - name: Generate daily predictions
        env:
          PYTHONUNBUFFERED: "1"
          TZ: "Asia/Taipei"
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ -n "${INPUT_DATE}" ]; then
            EXTRA_ARGS+=(--date "${INPUT_DATE}")
          fi
          python -m src.main --mode predict "${EXTRA_ARGS[@]}"

      # 預測流程本身會回填賽果，但預測若失敗就會跳過，因此獨立再跑一次
      # （idempotent，只補 actual_* / result_correct），確保命中率資料不中斷。
      - name: Backfill finished games
        if: always()
        env:
          PYTHONUNBUFFERED: "1"
          TZ: "Asia/Taipei"
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ -n "${INPUT_DATE}" ]; then
            EXTRA_ARGS+=(--date "${INPUT_DATE}")
          fi
          python -m src.main --mode settle "${EXTRA_ARGS[@]}"

      - name: Build static site
        if: always()
        run: python -m src.build_site

      - name: Commit and push data changes
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "::notice::No data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): update daily predictions ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
