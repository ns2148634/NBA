name: B - Daily Injury & Prediction

# 排程 B：抓取官網傷病報告並產出當日預測。
# 主執行 UTC 11:00（台北 19:00）→ 美東約 06:00，即使 GitHub 排程延遲 5–9 小時，
#   仍會落在晚間開打前；UTC 22:30（台北隔日 06:30）作為備援與賽果回填。
# 若當天已有賽前預測，賽後那趟不會用它覆蓋（main._should_keep_pre_game）。
# 產出：data/daily_predictions.json、data/history_log.csv（必要時一併刷新 team_ratings.json）
on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "比賽日期（美東時間 YYYY-MM-DD，留空代表今天）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: nba-data-write
  cancel-in-progress: false

jobs:
  daily-prediction:
    name: Generate daily predictions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # nbainjuries 透過 tabula-py 解析官網 PDF，需要 JRE/JDK。
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Verify Java
        run: java -version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate daily predictions
        env:
          PYTHONUNBUFFERED: "1"
          TZ: "Asia/Taipei"
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ -n "${INPUT_DATE}" ]; then
            EXTRA_ARGS+=(--date "${INPUT_DATE}")
          fi
          python -m src.main --mode predict "${EXTRA_ARGS[@]}"

      - name: Build static site
        run: python -m src.build_site

      - name: Commit and push data changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "::notice::No data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): update daily predictions ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
